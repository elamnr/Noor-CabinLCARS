# Add to /config/secrets.yaml on Home Assistant. Replace PASTE_TOKEN_HERE (first line of the
# command) with the fine-grained GitHub token (Noor-CabinLCARS only, Contents: read-only).
cabin_lcars_deploy_cmd: >-
  T=PASTE_TOKEN_HERE;
  cd /config/www && for f in cabin-lcars.js cabin-lcars-loader.js cabin-lcars-version.json;
  do curl -fsSL --retry 2 -H "Authorization: Bearer $T"
  -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28"
  -o "$f.tmp" "https://api.github.com/repos/elamnr/Noor-CabinLCARS/contents/$f?ref=deploy" || exit 1; done
  && mv cabin-lcars.js.tmp cabin-lcars.js
  && mv cabin-lcars-loader.js.tmp cabin-lcars-loader.js
  && mv cabin-lcars-version.json.tmp cabin-lcars-version.json
  && cat cabin-lcars-version.json
